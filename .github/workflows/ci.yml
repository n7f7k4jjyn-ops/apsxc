name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server
      - run: npm run test:production-import
      - run: npm test
      - run: npm run build
      - run: node --test tests/zig-sales.integration.test.mjs
        env:
          ZIG_SALES_BROWSER: '1'
      - run: node tests/rosters.browser.test.mjs
      - run: node --test tests/mobile-performance.browser.test.mjs
      - run: node --test tests/navigation.browser.test.mjs
      - run: node --test tests/finance-delete.browser.test.mjs
      - run: node --test tests/production-import.integration.test.mjs
        env:
          PRODUCTION_IMPORT_BROWSER: '1'
      - run: npm run lint

